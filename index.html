<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Game Studio - Game Reviews and Introductions</title>

    <meta name="description"
        content="Welcome to My Game Studio. Discover different games, read game introductions, and share your opinions with other players.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #071a2b;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 35px 20px;
            text-align: center;
            background: #0b2942;
        }

        header h1 {
            margin: 0;
            font-size: 48px;
            color: #4db8ff;
        }

        header p {
            font-size: 18px;
            color: #c8e8ff;
        }

        nav {
            padding: 15px;
            text-align: center;
            background: #061522;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 17px;
        }

        nav a:hover {
            color: #4db8ff;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        section {
            margin-bottom: 40px;
            padding: 25px;
            background: #0b2942;
            border-radius: 12px;
        }

        h2 {
            color: #4db8ff;
        }

        .game {
            padding: 20px;
            background: #092238;
            border-radius: 10px;
            margin-top: 20px;
        }

        .game h2 {
            margin-top: 0;
        }

        .game-description {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #1683c7;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #20a4f3;
        }

        input,
        textarea {
            width: 100%;
            margin-top: 8px;
            margin-bottom: 15px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .comment {
            margin-top: 15px;
            padding: 15px;
            background: #092238;
            border-radius: 8px;
        }

        .comment h3 {
            margin-top: 0;
            color: #4db8ff;
        }

        .admin-area {
            margin-top: 30px;
            text-align: center;
        }

        #admin-open-button {
            padding: 6px 12px;
            font-size: 12px;
            background: #092238;
            border: 1px solid #24506e;
        }

        #admin-open-button:hover {
            background: #1683c7;
        }

        #admin-login-box {
            display: none;
            max-width: 400px;
            margin: 20px auto 0;
            padding: 20px;
            background: #061522;
            border-radius: 10px;
            border: 1px solid #24506e;
        }

        #admin-login-box h3 {
            color: #4db8ff;
        }

        #admin-message {
            color: #c8e8ff;
        }

        #admin-cancel-button {
            background: #555;
            margin-left: 5px;
        }

        #admin-panel {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #061522;
            border-radius: 12px;
            border: 1px solid #1683c7;
            text-align: left;
        }

        #admin-panel h2 {
            margin-top: 0;
        }

        .admin-section {
            margin-top: 25px;
        }

        .admin-game {
            margin-top: 15px;
            padding: 18px;
            background: #092238;
            border-radius: 8px;
        }

        .admin-comment {
            margin-top: 12px;
            padding: 15px;
            background: #092238;
            border-radius: 8px;
        }

        .admin-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .edit-button {
            background: #1683c7;
        }

        .delete-button,
        .delete-comment {
            background: #a83232;
        }

        .delete-button:hover,
        .delete-comment:hover {
            background: #d44343;
        }

        .logout-button {
            margin-top: 20px;
            background: #555;
        }

        .logout-button:hover {
            background: #777;
        }

        .admin-edit-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #061522;
            border-radius: 8px;
        }

        .success {
            color: #7dff9b;
        }

        .error {
            color: #ff8585;
        }

        footer {
            padding: 25px;
            text-align: center;
            background: #061522;
            color: #aac8dc;
        }
    </style>
</head>

<body>

<header>
    <h1>My Game Studio</h1>

    <p>
        Welcome to my studio.
        Here I introduce different games and share information about them.
    </p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#games">Games</a>
    <a href="#comments">Comments</a>
</nav>

<main>

    <section id="games">

        <h2>Games</h2>

        <div id="games-list">
            <p>Loading games...</p>
        </div>

    </section>


    <section id="comments">

        <h2>Comments</h2>

        <p>
            Share your opinion about the games.
        </p>

        <form id="comment-form">

            <label for="name">
                Your name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="comment">
                Your comment
            </label>

            <textarea
                id="comment"
                placeholder="Write your comment..."
                required
            ></textarea>

            <button type="submit">
                Send Comment
            </button>

        </form>

        <div id="comments-list"></div>


        <div class="admin-area">

            <button id="admin-open-button">
                Admin
            </button>


            <div id="admin-login-box">

                <h3>
                    Admin Login
                </h3>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Admin password"
                >

                <button id="admin-login-button">
                    Login
                </button>

                <button id="admin-cancel-button">
                    Cancel
                </button>

                <p id="admin-message"></p>

            </div>


            <div id="admin-panel">

                <h2>
                    Admin Panel
                </h2>


                <div class="admin-section">

                    <h3>
                        Add New Game
                    </h3>

                    <label for="new-game-name">
                        Game Name
                    </label>

                    <input
                        type="text"
                        id="new-game-name"
                        placeholder="Game name"
                    >

                    <label for="new-game-description">
                        Game Description
                    </label>

                    <textarea
                        id="new-game-description"
                        placeholder="Game description"
                    ></textarea>

                    <button id="add-game">
                        Add Game
                    </button>

                    <p id="game-message"></p>

                </div>


                <div class="admin-section">

                    <h3>
                        Manage Games
                    </h3>

                    <div id="admin-games-list"></div>

                </div>


                <div class="admin-section">

                    <h3>
                        Manage Comments
                    </h3>

                    <div id="admin-comments-list"></div>

                </div>


                <button
                    id="admin-logout"
                    class="logout-button"
                >
                    Logout
                </button>

            </div>

        </div>

    </section>

</main>


<footer>

    <p>
        My Game Studio © 2026
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js"></script>

</body>

</html>
