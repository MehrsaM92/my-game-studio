<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeNest Studio — Admin Editor</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Inter, Arial, sans-serif;
            background: #0b1020;
            color: #fff;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #topbar {
            height: 62px;
            flex: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #11182d;
            border-bottom: 1px solid #26304c;
            z-index: 1000;
        }

        .logo {
            font-weight: 800;
            font-size: 18px;
            margin-right: 10px;
            white-space: nowrap;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn {
            height: 40px;
            min-width: 40px;
            padding: 0 12px;
            border-radius: 9px;
            background: #1a2440;
            color: #fff;
            border: 1px solid #2b3758;
            transition: .15s;
        }

        .tool-btn:hover {
            background: #243152;
        }

        .tool-btn.active {
            background: #3268ff;
            border-color: #4d7bff;
        }

        .tool-btn.save {
            background: #16a34a;
            border-color: #22c55e;
            font-weight: 700;
        }

        .tool-btn.save:hover {
            background: #15803d;
        }

        .device-select {
            height: 40px;
            border-radius: 9px;
            border: 1px solid #2b3758;
            background: #1a2440;
            color: #fff;
            padding: 0 10px;
            outline: none;
        }

        .status {
            margin-left: auto;
            font-size: 13px;
            color: #91a0c5;
            white-space: nowrap;
        }

        #workspace {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
            background: #080c17;
        }

        #canvas-scroll {
            position: absolute;
            inset: 0;
            overflow: auto;
            padding: 30px;
        }

        #canvas {
            position: relative;
            margin: auto;
            background: #202020;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, .5),
                0 0 0 1px #30384e;
        }

        #site-frame {
            display: block;
            border: 0;
            background: #fff;
        }

        #overlay {
            position: absolute;
            pointer-events: none;
            border: 2px solid #4d7cff;
            background: rgba(77, 124, 255, .06);
            z-index: 500;
            display: none;
        }

        #overlay-label {
            position: absolute;
            left: -2px;
            top: -25px;
            background: #4d7cff;
            color: #fff;
            padding: 4px 7px;
            border-radius: 5px 5px 0 0;
            font-size: 11px;
            white-space: nowrap;
        }

        #move-hint {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, .9);
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 8px 13px;
            border-radius: 9px;
            font-size: 12px;
            z-index: 600;
            pointer-events: none;
        }

        #inspector {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 320px;
            max-height: calc(100% - 24px);
            overflow: auto;
            background: rgba(15, 23, 42, .98);
            border: 1px solid #334155;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
            z-index: 800;
            display: none;
        }

        .inspector-head {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 13px;
            background: #111827;
            border-bottom: 1px solid #293449;
        }

        .inspector-title {
            font-weight: 700;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: auto;
        }

        #delete-element {
            height: 30px;
            padding: 0 10px;
            border-radius: 7px;
            background: #3a1720;
            border: 1px solid #6b2535;
            color: #fff;
        }

        #delete-element:hover {
            background: #4b1d28;
        }

        .close-btn {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: #1f2937;
            color: #fff;
        }

        .inspector-body {
            padding: 13px;
        }

        .field {
            margin-bottom: 13px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: #9ca9c4;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            background: #0b1222;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            outline: none;
            padding: 9px;
        }

        .field textarea {
            min-height: 90px;
            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: #4d7cff;
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .color-row {
            display: flex;
            gap: 8px;
        }

        .color-row input[type="color"] {
            width: 48px;
            padding: 3px;
        }

        .small-btn {
            width: 100%;
            height: 36px;
            border-radius: 8px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
        }

        .small-btn:hover {
            background: #29364b;
        }

        .danger {
            background: #3a1720;
            border-color: #6b2535;
        }

        .danger:hover {
            background: #4b1d28;
        }

        #add-menu {
            position: absolute;
            top: 58px;
            left: 120px;
            width: 190px;
            padding: 7px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
            z-index: 1200;
            display: none;
        }

        .add-item {
            width: 100%;
            padding: 10px;
            border-radius: 7px;
            background: transparent;
            color: #fff;
            text-align: left;
        }

        .add-item:hover {
            background: #1e293b;
        }

        #login-screen {
            position: fixed;
            inset: 0;
            background: #070b15;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5000;
        }

        .login-box {
            width: min(400px, 92vw);
            background: #111827;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
        }

        .login-box h1 {
            margin: 0 0 7px;
        }

        .login-box p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #0b1222;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 9px;
            outline: none;
        }

        .login-box button {
            width: 100%;
            height: 44px;
            background: #3268ff;
            color: #fff;
            border-radius: 9px;
            font-weight: 700;
        }

        #login-error {
            color: #f87171;
            font-size: 13px;
            margin-top: 10px;
            min-height: 18px;
        }

        @media(max-width:800px) {

            .logo {
                display: none;
            }

            #topbar {
                overflow-x: auto;
            }

            .status {
                display: none;
            }

            #inspector {
                width: min(320px, calc(100% - 24px));
            }

            #canvas-scroll {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div id="login-screen">

        <div class="login-box">

            <h1>CodeNest Admin</h1>

            <p>
                Login to edit the real CodeNest website.
            </p>

            <input id="email" type="email" placeholder="Email" autocomplete="username">

            <input id="password" type="password" placeholder="Password" autocomplete="current-password">

            <button id="login-btn">
                Login
            </button>

            <div id="login-error"></div>

        </div>

    </div>

    <div id="app">

        <div id="topbar">

            <div class="logo">
                CodeNest Admin
            </div>

            <div class="toolbar-group">

                <button class="tool-btn" id="add-btn">
                    ＋ Add
                </button>

                <button class="tool-btn" id="undo-btn" title="Undo">
                    ↶
                </button>

                <button class="tool-btn" id="redo-btn" title="Redo">
                    ↷
                </button>

            </div>

            <div class="toolbar-group">

                <button class="tool-btn device active" data-device="desktop">
                    🖥 Desktop
                </button>

                <button class="tool-btn device" data-device="tablet">
                    ▣ Tablet
                </button>

                <button class="tool-btn device" data-device="mobile">
                    📱 Mobile
                </button>

            </div>

            <div class="toolbar-group">

                <select id="language-preview" class="device-select">
                    <option value="en">English</option>
                    <option value="fa">فارسی</option>
                </select>

            </div>

            <button class="tool-btn save" id="save-btn">
                💾 Save
            </button>

            <div class="status" id="status">
                Loading...
            </div>

        </div>

        <div id="workspace">

            <div id="canvas-scroll">

                <div id="canvas">

                    <iframe id="site-frame" src="./index.html"></iframe>

                    <div id="overlay">

                        <div id="overlay-label">
                            Element
                        </div>

                    </div>

                </div>

            </div>

            <div id="move-hint">
                Click an element to select • Drag to move • Double-click text to edit
            </div>

            <div id="inspector">

                    <div class="field" id="button-link-field" style="display:none;">

                                Font size

                                <option value="800">

                                </option>

                                <option value="900">
                                    900

                            </select>

                        </div>

                    <div class="field">

                        <label>
                            Text align
                        </label>

                        <select id="prop-align">

                            <option value="left">
                                Left
                            </option>

                            <option value="center">
                                Center
                            </option>

                            <option value="right">
                                Right
                            </option>

                            <option value="justify">
                                Justify
                            </option>

                        </select>

                    </div>

                    <div class="two">

                        <div class="field">

                            <label>
                                Width
                            </label>

                            <input id="prop-width" type="text" placeholder="auto">

                        </div>

                        <div class="field">

                            <label>
                                Height
                            </label>

                            <input id="prop-height" type="text" placeholder="auto">

                    <div class="two">

                        <div class="field">

                            <label>
                                Margin
                            </label>

                            <input id="prop-margin" type="text">

                        <div class="field">

                            <label>

                            <input id="prop-padding" type="text">

                    <div class="field">

                        <label>

                        <div class="two">

                            <input id="prop-x" type="number">

                    <div class="field">

                        <button class="small-btn" id="reset-position">
                            Reset position

                    <div class="field">

                        <button class="small-btn danger" id="hide-element">

                </div>

            </div>

            <div id="add-menu">

                <button class="add-item" data-add="text">
                    T&nbsp; Text
                </button>

                <button class="add-item" data-add="heading">

                </button>

                <button class="add-item" data-add="button">

                <button class="add-item" data-add="box">

                </button>

                <button class="add-item" data-add="divider">

        </div>

    </div>

    <script>

        const SUPABASE_URL =
            "https://iqmsaflqplvzfvmdyrwh.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vib0xKSHlp-04KNTM0Y1kg_hc-yjUK5";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const frame =
            document.getElementById("site-frame");

        const canvas =
            document.getElementById("canvas");

        const scrollArea =
            document.getElementById("canvas-scroll");

        const overlay =
            document.getElementById("overlay");

        const overlayLabel =
            document.getElementById("overlay-label");

        const inspector =
            document.getElementById("inspector");

        const statusEl =
            document.getElementById("status");

        const addMenu =
            document.getElementById("add-menu");

        const deleteButton =
            document.getElementById("delete-element");


        const DEVICES = {

            desktop: {
                width: 1440,
                height: 900
            },

            tablet: {
                width: 768,
                height: 1024
            },

            mobile: {
                width: 390,
                height: 844
            }

        };


        const PROTECTED_SELECTOR = [

            "#leaderboard",
            "#comments-section",
            ".like-box",
            ".like-button",
            ".like-count",
            ".likes-text",
            ".review-popup"

        ].join(",");


        let currentDevice = "desktop";

        let selectedElement = null;

        let selectedData = null;

        let settingsId = null;

        let addingType = null;

        let dragState = null;

        let history = [];

        let historyIndex = -1;

        let frameEventsReady = false;


        let editor = {

            version: 3,

            elements: {},

            customElements: []

        };


        function setStatus(text) {

            statusEl.textContent =
                text;

        }


        function deepClone(value) {

            try {

                return JSON.parse(
                    JSON.stringify(value)
                );

            } catch (error) {

                console.error(
                    "Deep clone error:",
                    error
                );

                return null;

            }

        }


        function wait(ms) {

            return new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        ms
                    )
            );

        }


        function ensureEditorStructure() {

            if (
                !editor ||
                typeof editor !== "object" ||
                Array.isArray(editor)
            ) {

                editor = {};

            }

            if (!editor.version) {

                editor.version = 3;

            }

            if (
                !editor.elements ||
                typeof editor.elements !== "object" ||
                Array.isArray(editor.elements)
            ) {

                editor.elements = {};

            }

            if (
                !Array.isArray(
                    editor.customElements
                )
            ) {

                editor.customElements = [];

            }

        }


        function cssEscape(value) {

            if (
                window.CSS &&
                CSS.escape
            ) {

                return CSS.escape(value);

            }

            return String(value).replace(
                /([ !"#$%&'()*+,./:;<=>?@[\\\]^`{|}~])/g,
                "\\$1"
            );

        }


        function getSelector(element) {

            if (!element)
                return null;


            if (element.id) {

                return "#" +
                    cssEscape(element.id);

            }


            if (
                element.hasAttribute("data-id")
            ) {

                return `[data-id="${cssEscape(
                    element.getAttribute("data-id")
                )}"]`;

            }


            const parts = [];

            let current =
                element;


            while (
                current &&
                current.nodeType === 1 &&
                current.tagName.toLowerCase() !== "html"
            ) {

                let part =
                    current.tagName.toLowerCase();


                if (
                    current.classList &&
                    current.classList.length
                ) {

                    const usefulClass =
                        [
                            ...current.classList
                        ]
                            .filter(
                                c =>
                                    ![
                                        "like-box",
                                        "like-button",
                                        "like-count",
                                        "likes-text"
                                    ].includes(c)
                            )
                            .slice(0, 2);


                    if (
                        usefulClass.length
                    ) {

                        part += "." +
                            usefulClass
                                .map(cssEscape)
                                .join(".");

                    }

                }


                const parent =
                    current.parentElement;


                if (parent) {

                    const same =
                        [
                            ...parent.children
                        ]
                            .filter(
                                x =>
                                    x.tagName ===
                                    current.tagName
                            );


                    if (
                        same.length > 1
                    ) {

                        const index =
                            same.indexOf(current) + 1;

                        part +=
                            `:nth-of-type(${index})`;

                    }

                }


                parts.unshift(part);

                current =
                    parent;

            }


            return parts.join(" > ");

        }


        function isProtected(element) {

            if (!element)
                return true;

            try {

                return !!element.closest(
                    PROTECTED_SELECTOR
                );

            } catch {

                return false;

            }

        }


        function discoverPage() {

            const doc =
                frame.contentDocument;


            if (
                !doc ||
                !doc.body
            )
                return;


            const all =
                [
                    ...doc.body.querySelectorAll("*")
                ];


            all.forEach(
                element => {

                    if (
                        isProtected(element)
                    )
                        return;


                    if (
                        element.hasAttribute(
                            "data-codenest-custom"
                        )
                    )
                        return;


                    const tag =
                        element.tagName.toLowerCase();


                    if (
                        tag === "script" ||
                        tag === "style" ||
                        tag === "meta" ||
                        tag === "link"
                    )
                        return;


                    const selector =
                        getSelector(element);


                    if (!selector)
                        return;


                    const encoded =
                        btoa(selector)
                            .replace(
                                /[^a-zA-Z0-9]/g,
                                ""
                            )
                            .slice(0, 35);


                    const id =
                        "el_" + encoded;


                    element.dataset.codenestId =
                        id;

                }
            );

        }


        function getElementFromPoint(x, y) {

            const doc =
                frame.contentDocument;


            if (!doc)
                return null;


            let element =
                doc.elementFromPoint(x, y);


            if (!element)
                return null;


            while (
                element &&
                element !== doc.body
            ) {

                if (
                    element.dataset &&
                    element.dataset.codenestId
                ) {

                    return element;

                }


                element =
                    element.parentElement;

            }


            return null;

        }


        function createDefaultSettings(element) {

            const computed =
                getComputedStyle(element);


            return {

                selector:
                    getSelector(element),

                text:
                    element.innerHTML,

                color:
                    computed.color,

                fontSize:
                    parseFloat(
                        computed.fontSize
                    ) || 16,

                fontWeight:
                    computed.fontWeight,

                textAlign:
                    computed.textAlign,

                width: "",

                height: "",

                margin: "",

                padding: "",

                positions: {

                    desktop: {
                        x: 0,
                        y: 0
                    },

                    tablet: {
                        x: 0,
                        y: 0
                    },

                    mobile: {
                        x: 0,
                        y: 0
                    }

                },

                hidden: false

            };

        }


        function getElementSettings(element) {

            if (!element)
                return null;


            const id =
                element.dataset.codenestId;


            if (!id)
                return null;


            ensureEditorStructure();


            if (!editor.elements[id]) {

                editor.elements[id] =
                    createDefaultSettings(
                        element
                    );

            }


            const settings =
                editor.elements[id];


            if (!settings.selector) {

                settings.selector =
                    getSelector(element);

            }


            if (!settings.positions) {

                settings.positions = {

                    desktop: {
                        x: 0,
                        y: 0
                    },

                    tablet: {
                        x: 0,
                        y: 0
                    },

                    mobile: {
                        x: 0,
                        y: 0
                    }

                };

            }


            if (
                !settings.positions[currentDevice]
            ) {

                settings.positions[currentDevice] = {
                    x: 0,
                    y: 0
                };

            }


            return settings;

        }


        function applyElementSettings(
            element,
            settings
        ) {

            if (
                !element ||
                !settings
            )
                return;


            if (
                isProtected(element)
            )
                return;


            if (
                element.hasAttribute(
                    "data-codenest-custom"
                )
            )
                return;


            if (
                settings.text !== undefined
            ) {

                element.innerHTML =
                    settings.text;

            }


            if (
                settings.color
            ) {

                element.style.setProperty(
                    "color",
                    settings.color,
                    "important"
                );

            }


            if (
                settings.fontSize !== undefined &&
                settings.fontSize !== null &&
                settings.fontSize !== ""
            ) {

                element.style.fontSize =
                    Number(settings.fontSize) +
                    "px";

            }


            if (
                settings.fontWeight
            ) {

                element.style.fontWeight =
                    settings.fontWeight;

            }


            if (
                settings.textAlign
            ) {

                element.style.textAlign =
                    settings.textAlign;

            }


            if (
                settings.width
            ) {

                element.style.width =
                    settings.width;

            }


            if (
                settings.height
            ) {

                element.style.height =
                    settings.height;

            }


            if (
                settings.margin
            ) {

                element.style.margin =
                    settings.margin;

            }


            if (
                settings.padding
            ) {

                element.style.padding =
                    settings.padding;

            }


            if (
                settings.hidden === true
            ) {

                element.style.display =
                    "none";

            } else {

                element.style.removeProperty(
                    "display"
                );

            }


            const position =
                settings.positions?.[currentDevice] || {
                    x: 0,
                    y: 0
                };


            element.style.translate =
                `${Number(position.x) || 0}px ${Number(position.y) || 0}px`;

        }


        function applyCustomElement(
            element,
            item
        ) {

            if (
                !element ||
                !item
            )
                return;


            element.innerHTML =
                item.html ??
                item.text ??
                "";


            element.style.position =
                "absolute";


            element.style.left =
                (Number(item.x) || 0) +
                "px";


            element.style.top =
                (Number(item.y) || 0) +
                "px";


            element.style.zIndex =
                "999999";


            element.style.setProperty(
                "color",
                item.color || "#ffffff",
                "important"
            );


            element.style.fontSize =
                (Number(item.fontSize) || 18) +
                "px";


            element.style.fontWeight =
                item.fontWeight ||
                "normal";


            element.style.textAlign =
                item.textAlign ||
                "left";


            element.style.width =
                item.width ||
                "auto";


            element.style.height =
                item.height ||
                "auto";


            element.style.background =
                item.background ||
                "transparent";


            element.style.padding =
                item.padding ||
                "5px";


            element.style.margin =
                item.margin ||
                "";


            element.style.cursor =
                item.type === "button"
                    ? "pointer"
                    : "default";


            if (item.hidden) {

                element.style.display =
                    "none";

            } else {

                element.style.removeProperty(
                    "display"
                );

            }


            if (
                item.type === "button"
            ) {

                element.onclick =
                    function (event) {

                        if (
                            item.link &&
                            String(item.link).trim()
                        ) {

                            event.preventDefault();
                            event.stopPropagation();

                            window.open(
                                String(item.link).trim(),
                                "_blank",
                                "noopener,noreferrer"
                            );

                        } else {

                            event.preventDefault();

                        }

                    };

            }

        }


        function applyEditor() {

            const doc =
                frame.contentDocument;


            if (
                !doc ||
                !doc.body
            )
                return;


            ensureEditorStructure();

            discoverPage();


            Object.entries(
                editor.elements
            ).forEach(
                ([id, settings]) => {

                    if (
                        !settings ||
                        !settings.selector
                    )
                        return;


                    let element =
                        null;


                    try {

                        element =
                            doc.querySelector(
                                settings.selector
                            );

                    } catch (error) {

                        console.warn(
                            "Invalid selector:",
                            settings.selector
                        );

                        return;

                    }


                    if (!element)
                        return;


                    if (
                        isProtected(element)
                    )
                        return;


                    element.dataset.codenestId =
                        id;


                    applyElementSettings(
                        element,
                        settings
                    );

                }
            );


            doc
                .querySelectorAll(
                    "[data-codenest-custom]"
                )
                .forEach(
                    element => {
                        element.remove();
                    }
                );


            editor.customElements.forEach(
                item => {

                    if (
                        !item ||
                        !item.id
                    )
                        return;


                    const element =
                        doc.createElement("div");


                    element.dataset.codenestCustom =
                        "true";


                    element.dataset.codenestId =
                        item.id;


                    applyCustomElement(
                        element,
                        item
                    );


                    doc.body.appendChild(
                        element
                    );

                }
            );


            if (
                selectedData &&
                selectedData.id
            ) {

                const selectedId =
                    selectedData.id;

                const newSelected =
                    doc.querySelector(
                        `[data-codenest-custom="true"][data-codenest-id="${cssEscape(selectedId)}"]`
                    );

                if (newSelected) {

                    selectedElement =
                        newSelected;

                    selectedData =
                        editor.customElements.find(
                            item =>
                                item.id === selectedId
                        ) || selectedData;

                    overlay.style.display =
                        "block";

                    inspector.style.display =
                        "block";

                    fillInspector();

                }

            }


            updateOverlay();

        }


        function syncEditorFromFrame() {

            const doc =
                frame.contentDocument;


            if (
                !doc ||
                !doc.body
            )
                return;


            ensureEditorStructure();

            discoverPage();


            const elements =
                [
                    ...doc.body.querySelectorAll(
                        "[data-codenest-id]:not([data-codenest-custom])"
                    )
                ];


            elements.forEach(
                element => {

                    if (
                        isProtected(element)
                    )
                        return;


                    const id =
                        element.dataset.codenestId;


                    if (!id)
                        return;


                    let settings =
                        editor.elements[id];


                    if (!settings) {

                        settings =
                            createDefaultSettings(
                                element
                            );

                        editor.elements[id] =
                            settings;

                    }


                    settings.selector =
                        getSelector(element);


                    settings.text =
                        element.innerHTML;


                    const computed =
                        getComputedStyle(element);


                    settings.color =
                        element.style.color ||
                        settings.color ||
                        computed.color;


                    settings.fontSize =
                        parseFloat(
                            element.style.fontSize
                        ) ||
                        Number(settings.fontSize) ||
                        parseFloat(computed.fontSize) ||
                        16;


                    settings.fontWeight =
                        element.style.fontWeight ||
                        settings.fontWeight ||
                        computed.fontWeight;


                    settings.textAlign =
                        element.style.textAlign ||
                        settings.textAlign ||
                        computed.textAlign;


                    if (
                        settings.width === undefined
                    ) {

                        settings.width = "";

                    }


                    if (
                        settings.height === undefined
                    ) {

                        settings.height = "";

                    }


                    if (
                        settings.margin === undefined
                    ) {

                        settings.margin = "";

                    }


                    if (
                        settings.padding === undefined
                    ) {

                        settings.padding = "";

                    }


                    if (!settings.positions) {

                        settings.positions = {

                            desktop: {
                                x: 0,
                                y: 0
                            },

                            tablet: {
                                x: 0,
                                y: 0
                            },

                            mobile: {
                                x: 0,
                                y: 0
                            }

                        };

                    }


                    if (
                        !settings.positions[currentDevice]
                    ) {

                        settings.positions[currentDevice] = {
                            x: 0,
                            y: 0
                        };

                    }

                }
            );


            editor.version = 3;

        }


        function setDevice(device) {

            if (
                !DEVICES[device]
            )
                return;


            currentDevice =

            const size =
                DEVICES[device];

        function selectElement(element) {

            if (!element)
                return;


            selectedElement =
                element;


            const isCustom =
                element.hasAttribute(
                    "data-codenest-custom"
                );


            if (isCustom) {

                const id =
                    element.dataset.codenestId;


                selectedData =
                    editor.customElements.find(
                        item =>
                            item.id === id
                    );

            } else {

                selectedData =
                    getElementSettings(
                        element
                    );

            }


            if (!selectedData)
                return;


            if (isCustom && !selectedData.id) {

                selectedData.id =
                    element.dataset.codenestId;

            }


            overlay.style.display =
                "block";


            inspector.style.display =
                "block";


            inspector
                .querySelector(".inspector-title")
                .textContent =
                isCustom
                    ? "Custom Element"
                    : "Element";


            fillInspector();

            updateOverlay();

        }


        function updateOverlay() {

            if (
                !selectedElement ||
                !selectedElement.isConnected
            ) {

                overlay.style.display =
                    "none";

                return;

            }


            const rect =
                selectedElement.getBoundingClientRect();


            const frameRect =
                frame.getBoundingClientRect();


            const iframeWidth =
                frame.contentWindow?.innerWidth ||
                DEVICES[currentDevice].width;


            const iframeHeight =
                frame.contentWindow?.innerHeight ||
                DEVICES[currentDevice].height;


            const scaleX =
                frameRect.width /
                iframeWidth;


            const scaleY =
                frameRect.height /
                iframeHeight;


            const x =
                frame.offsetLeft +
                rect.left * scaleX;


            const y =
                frame.offsetTop +
                rect.top * scaleY;


            overlay.style.left =
                x + "px";


            overlay.style.top =
                y + "px";


            overlay.style.width =
                rect.width *
                scaleX +
                "px";


            overlay.style.height =
                rect.height *
                scaleY +
                "px";


            overlayLabel.textContent =
                selectedElement.tagName.toLowerCase() +
                (
                    selectedElement.id
                        ? " #" +
                        selectedElement.id
                        : ""
                );

        }


        function normalizeColor(color) {

            if (!color)
                return "#ffffff";


            color =
                String(color).trim();


            if (
                color.startsWith("#")
            ) {

                if (
                    color.length === 4
                ) {

                    return "#" +
                        color[1] +
                        color[1] +
                        color[2] +
                        color[2] +
                        color[3] +
                        color[3];

                }


                if (
                    /^#[0-9a-fA-F]{6}$/.test(color)
                ) {

                    return color;

                }


                return "#ffffff";

            }


            const match =
                color.match(/\d+/g);


            if (
                !match ||
                match.length < 3
            )
                return "#ffffff";


            const rgb =
                match
                    .slice(0, 3)
                    .map(
                        value =>
                            Math.max(
                                0,
                                Math.min(
                                    255,
                                    parseInt(value, 10)
                                )
                            )
                                .toString(16)
                                .padStart(2, "0")
                    )
                    .join("");


            return "#" + rgb;

        }

            }

                normalizeColor(

                );

            ).value =
                selectedData.textAlign ||

            document.getElementById(
                "prop-width"
            ).value =

            document.getElementById(

            ).value =

                    };

                ).value =

                    Number(pos.y) ||

        function saveHistory() {

            ensureEditorStructure();


            const snapshot =
                deepClone(editor);


            if (!snapshot)
                return;


            history =
                history.slice(
                    0,
                    historyIndex + 1
                );


            history.push(snapshot);


            historyIndex =
                history.length - 1;


            if (
                history.length > 40
            ) {

                history.shift();

                historyIndex--;

            }

        }


        function restoreSelectedAfterApply() {

            if (
                !selectedData
            )
                return;


            const selectedId =
                selectedData.id;


            if (
                !selectedId
            )
                return;


            const custom =
                editor.customElements.find(
                    item =>
                        item.id === selectedId
                );


            if (custom) {

                const element =
                    frame.contentDocument?.querySelector(
                        `[data-codenest-custom="true"][data-codenest-id="${cssEscape(selectedId)}"]`
                    );


                if (element) {

                    selectedElement =
                        element;

                    selectedData =
                        custom;

                    fillInspector();

                    updateOverlay();

                }

            }

        }


        function undo() {

            if (
                historyIndex <= 0
            )
                return;


            const oldSelectedId =
                selectedData?.id ||
                selectedElement?.dataset?.codenestId ||
                null;


            historyIndex--;


            editor =
                deepClone(
                    history[historyIndex]
                );


            ensureEditorStructure();


            applyEditor();


            if (oldSelectedId) {

                const custom =
                    editor.customElements.find(
                        item =>
                            item.id === oldSelectedId
                    );


                if (custom) {

                    selectedElement =
                        frame.contentDocument?.querySelector(
                            `[data-codenest-custom="true"][data-codenest-id="${cssEscape(oldSelectedId)}"]`
                        ) || null;


                    selectedData =
                        custom;

                } else {

                    const settings =
                        editor.elements[
                        oldSelectedId
                        ];


                    if (
                        settings?.selector
                    ) {

                        try {

                            selectedElement =
                                frame.contentDocument.querySelector(
                                    settings.selector
                                );

                        } catch {

                            selectedElement =
                                null;

                        }


                        selectedData =
                            settings;

                    }

                }

            }


            if (selectedElement) {

                inspector.style.display =
                    "block";

                overlay.style.display =
                    "block";

                fillInspector();

            }


            updateOverlay();

            setStatus("Undo");

        }

                        ];

                                );

            }


            updateOverlay();
