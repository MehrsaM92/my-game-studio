        function propertyChanged(event) {

            if (
                !selectedElement ||
                !selectedData ||
                !event ||
                !event.target
            )
                return;


            const id =
                event.target.id;


            let value =
                event.target.value;


            let property =
                "";


            if (id === "prop-text") {

                property = "text";

            } else if (
                id === "prop-link"
            ) {

                property = "link";

            } else if (
                id === "prop-color"
            ) {

                property = "color";

            } else if (
                id === "prop-font-size"
            ) {

                property = "fontSize";

            } else if (
                id === "prop-font-weight"
            ) {

                property = "fontWeight";

            } else if (
                id === "prop-align"
            ) {

                property = "textAlign";

            } else if (
                id === "prop-width"
            ) {

                property = "width";

            } else if (
                id === "prop-height"
            ) {

                property = "height";

            } else if (
                id === "prop-margin"
            ) {

                property = "margin";

            } else if (
                id === "prop-padding"
            ) {

                property = "padding";

            } else if (
                id === "prop-x"
            ) {

                property = "x";

            } else if (
                id === "prop-y"
            ) {

                property = "y";

            }


            if (!property)
                return;


            const isCustom =
                selectedElement.hasAttribute(
                    "data-codenest-custom"
                );


            if (isCustom) {

                saveHistory();


                if (
                    property === "text"
                ) {

                    selectedData.text =
                        value;

                    selectedData.html =
                        value;

                    selectedElement.innerHTML =
                        value;

                }


                else if (
                    property === "link"
                ) {

                    selectedData.link =
                        value.trim();

                    applyCustomElement(
                        selectedElement,
                        selectedData
                    );

                }


                else if (
                    property === "color"
                ) {

                    value =
                        normalizeColor(value);

                    selectedData.color =
                        value;

                    selectedElement.style.setProperty(
                        "color",
                        value,
                        "important"
                    );

                }


                else if (
                    property === "fontSize"
                ) {

                    selectedData.fontSize =
                        Number(value) || 18;

                    selectedElement.style.fontSize =
                        (
                            Number(value) ||
                            18
                        ) + "px";

                }


                else if (
                    property === "fontWeight"
                ) {

                    selectedData.fontWeight =
                        value;

                    selectedElement.style.fontWeight =
                        value;

                }


                else if (
                    property === "textAlign"
                ) {

                    selectedData.textAlign =
                        value;

                    selectedElement.style.textAlign =
                        value;

                }


                else if (
                    property === "width"
                ) {

                    selectedData.width =
                        value;

                    selectedElement.style.width =
                        value ||
                        "auto";

                }


                else if (
                    property === "height"
                ) {

                    selectedData.height =
                        value;

                    selectedElement.style.height =
                        value ||
                        "auto";

                }


                else if (
                    property === "padding"
                ) {

                    selectedData.padding =
                        value;

                    selectedElement.style.padding =
                        value;

                }


                else if (
                    property === "margin"
                ) {

                    selectedData.margin =
                        value;

                    selectedElement.style.margin =
                        value;

                }


                else if (
                    property === "x"
                ) {

                    selectedData.x =
                        Number(value) || 0;

                    selectedElement.style.left =
                        selectedData.x +
                        "px";

                }


                else if (
                    property === "y"
                ) {

                    selectedData.y =
                        Number(value) || 0;

                    selectedElement.style.top =
                        selectedData.y +
                        "px";

                }


                updateOverlay();

                return;

            }


            saveHistory();


            selectedData[property] =
                value;


            if (
                property === "fontSize"
            ) {

                selectedData.fontSize =
                    Number(value) || 16;

            }


            if (
                property === "color"
            ) {

                selectedData.color =
                    normalizeColor(value);

            }


            applyElementSettings(
                selectedElement,
                selectedData
            );


            updateOverlay();

        }


        function startDrag(event) {

            if (
                !selectedElement ||
                !selectedData
            )
                return;


            saveHistory();


            dragState = {

                dragging: true,

                startX:
                    event.clientX,

                startY:
                    event.clientY,

                oldX: 0,

                oldY: 0

            };


            if (
                selectedElement.hasAttribute(
                    "data-codenest-custom"
                )
            ) {

                dragState.oldX =
                    Number(
                        selectedData.x
                    ) || 0;

                dragState.oldY =
                    Number(
                        selectedData.y
                    ) || 0;

            } else {

                if (
                    !selectedData.positions
                ) {

                    selectedData.positions = {};

                }


                if (
                    !selectedData.positions[
                    currentDevice
                    ]
                ) {

                    selectedData.positions[
                        currentDevice
                    ] = {
                        x: 0,
                        y: 0
                    };

                }


                const position =
                    selectedData.positions[
                    currentDevice
                    ];


                dragState.oldX =
                    Number(position.x) || 0;

                dragState.oldY =
                    Number(position.y) || 0;

            }

        }


        function dragMove(event) {

            if (
                !dragState ||
                !dragState.dragging ||
                !selectedElement ||
                !selectedData
            )
                return;


            const dx =
                event.clientX -
                dragState.startX;


            const dy =
                event.clientY -
                dragState.startY;


            const newX =
                dragState.oldX +
                dx;


            const newY =
                dragState.oldY +
                dy;


            if (
                selectedElement.hasAttribute(
                    "data-codenest-custom"
                )
            ) {

                selectedData.x =
                    Math.round(newX);

                selectedData.y =
                    Math.round(newY);


                selectedElement.style.left =
                    selectedData.x +
                    "px";


                selectedElement.style.top =
                    selectedData.y +
                    "px";

            } else {

                selectedData.positions[
                    currentDevice
                ] = {

                    x:
                        Math.round(newX),

                    y:
                        Math.round(newY)

                };


                applyElementSettings(
                    selectedElement,
                    selectedData
                );

            }


            updateOverlay();

        }


        function endDrag() {

            if (!dragState)
                return;


            dragState =
                null;


            setStatus("Moved");

        }


        function addCustomElement(
            type,
            event
        ) {

            const doc =
                frame.contentDocument;


            if (!doc)
                return;


            const frameRect =
                frame.getBoundingClientRect();


            const x =
                Math.round(
                    event.clientX -
                    frameRect.left
                );


            const y =
                Math.round(
                    event.clientY -
                    frameRect.top
                );


            const id =
                "custom_" +
                Date.now();


            let item = {

                id,

                type,

                text:
                    "New element",

                html:
                    "New element",

                link:
                    "",

                x,

                y,

                width:
                    "auto",

                height:
                    "auto",

                color:
                    "#ffffff",

                fontSize:
                    18,

                fontWeight:
                    "normal",

                textAlign:
                    "left",

                background:
                    "transparent",

                padding:
                    "8px",

                margin:
                    "",

                hidden:
                    false

            };


            if (
                type === "heading"
            ) {

                item.text =
                    "New Heading";

                item.html =
                    "<strong>New Heading</strong>";

                item.fontSize =
                    32;

                item.fontWeight =
                    "800";

            }


            if (
                type === "button"
            ) {

                item.text =
                    "Button";

                item.html =
                    "Button";

                item.link =
                    "";

                item.background =
                    "#3268ff";

                item.padding =
                    "10px 18px";

                item.fontWeight =
                    "700";

            }


            if (
                type === "box"
            ) {

                item.text =
                    "Box";

                item.html =
                    "Box";

                item.background =
                    "#1e293b";

                item.padding =
                    "20px";

                item.width =
                    "250px";

                item.height =
                    "120px";

            }


            if (
                type === "divider"
            ) {

                item.text =
                    "";

                item.html =
                    "";

                item.background =
                    "#64748b";

                item.width =
                    "250px";

                item.height =
                    "2px";

                item.padding =
                    "0";

            }


            ensureEditorStructure();


            saveHistory();


            editor.customElements.push(
                item
            );


            const element =
                doc.createElement("div");


            element.dataset.codenestCustom =
                "true";


            element.dataset.codenestId =
                id;


            applyCustomElement(
                element,
                item
            );


            doc.body.appendChild(
                element
            );


            selectedElement =
                element;


            selectedData =
                item;


            overlay.style.display =
                "block";


            inspector.style.display =
                "block";


            inspector
                .querySelector(".inspector-title")
                .textContent =
                "Custom Element";


            fillInspector();

            updateOverlay();

            setStatus(
                "Added new element"
            );

        }


        function frameClick(event) {

            if (addingType) {

                addCustomElement(
                    addingType,
                    event
                );


                addingType =
                    null;


                addMenu.style.display =
                    "none";


                return;

            }


            const element =
                getElementFromPoint(
                    event.clientX,
                    event.clientY
                );


            if (element) {

                selectElement(
                    element
                );

            }

        }


        function setupFrameEvents() {

            const doc =
                frame.contentDocument;


            if (!doc)
                return;


            if (frameEventsReady)
                return;


            frameEventsReady =
                true;


            discoverPage();


            doc.addEventListener(
                "click",
                frameClick,
                true
            );


            doc.addEventListener(
                "mousedown",
                event => {

                    const element =
                        getElementFromPoint(
                            event.clientX,
                            event.clientY
                        );


                    if (
                        element &&
                        !isProtected(element)
                    ) {

                        selectElement(
                            element
                        );


                        startDrag(
                            event
                        );

                    }

                },
                true
            );


            doc.addEventListener(
                "mousemove",
                event => {

                    if (dragState) {

                        dragMove(
                            event
                        );

                    }

                },
                true
            );


            doc.addEventListener(
                "mouseup",
                () => {

                    endDrag();

                },
                true
            );


            doc.addEventListener(
                "dblclick",
                event => {

                    const element =
                        getElementFromPoint(
                            event.clientX,
                            event.clientY
                        );


                    if (
                        element &&
                        !isProtected(element)
                    ) {

                        selectElement(
                            element
                        );


                        const textBox =
                            document.getElementById(
                                "prop-text"
                            );


                        textBox.focus();

                        textBox.select();

                    }

                },
                true
            );

        }


        async function loadEditor() {

            setStatus(
                "Loading settings..."
            );


            try {

                const result =
                    await supabaseClient
                        .from("site_settings")
                        .select(
                            "id,editor_data"
                        )
                        .order(
                            "id",
                            {
                                ascending: true
                            }
                        )
                        .limit(1)
                        .maybeSingle();


                if (result.error) {

                    console.error(
                        "Load error:",
                        result.error
                    );


                    setStatus(
                        "Database error"
                    );


                    return;

                }


                if (!result.data) {

                    setStatus(
                        "No site_settings row"
                    );


                    return;

                }


                settingsId =
                    result.data.id;


                let savedEditor =
                    result.data.editor_data;


                if (
                    typeof savedEditor ===
                    "string"
                ) {

                    try {

                        savedEditor =
                            JSON.parse(
                                savedEditor
                            );

                    } catch {

                        savedEditor = {};

                    }

                }


                if (
                    savedEditor &&
                    typeof savedEditor === "object" &&
                    !Array.isArray(savedEditor)
                ) {

                    editor =
                        savedEditor;

                } else {

                    editor = {

                        version: 3,

                        elements: {},

                        customElements: []

                    };

                }


                ensureEditorStructure();


                saveHistory();


                if (
                    frame.contentDocument &&
                    frame.contentDocument.readyState !== "loading"
                ) {

                    discoverPage();

                    applyEditor();

                }


                setStatus(
                    "Ready"
                );


            } catch (error) {

                console.error(
                    "Load editor exception:",
                    error
                );


                setStatus(
                    "Database error"
                );

            }

        }


        function ensureEditorShape() {

            ensureEditorStructure();

        }


        async function saveEditor() {

            if (!settingsId) {

                setStatus(
                    "No settings row"
                );

                console.error(
                    "CodeNest: settingsId is missing"
                );

                return;

            }


            setStatus(
                "Collecting changes..."
            );


            ensureEditorShape();


            discoverPage();


            const doc =
                frame.contentDocument;


            if (
                !doc ||
                !doc.body
            ) {

                setStatus(
                    "Frame not ready"
                );

                return;

            }


            const elements =
                doc.body.querySelectorAll(
                    "[data-codenest-id]:not([data-codenest-custom])"
                );


            elements.forEach(
                element => {

                    if (
                        isProtected(element)
                    )
                        return;


                    const id =
                        element.dataset.codenestId;


                    if (!id)
                        return;


                    if (
                        !editor.elements[id]
                    ) {

                        editor.elements[id] =
                            createDefaultSettings(
                                element
                            );

                    }

                }
            );


            ensureEditorShape();


            const dataToSave =
                deepClone(editor);


            if (!dataToSave) {

                setStatus(
                    "Save failed"
                );

                return;

            }


            const elementCount =
                Object.keys(
                    dataToSave.elements || {}
                ).length;


            console.log(
                "CodeNest: settingsId =",
                settingsId
            );


            console.log(
                "CodeNest: saving",
                elementCount,
                "elements"
            );


            console.log(
                "CodeNest: custom elements =",
                dataToSave.customElements
            );


            setStatus(
                "Saving..."
            );


            const result =
                await supabaseClient
                    .from("site_settings")
                    .update({
                        editor_data:
                            dataToSave
                    })
                    .eq(
                        "id",
                        settingsId
                    )
                    .select(
                        "id, editor_data"
                    );


            console.log(
                "CodeNest: UPDATE result =",
                result
            );


            if (result.error) {

                console.error(
                    "CodeNest Save Error:",
                    result.error
                );


                setStatus(
                    "Save failed"
                );


                alert(
                    "Save failed:\n" +
                    result.error.message
                );


                return;

            }


            if (
                !result.data ||
                result.data.length === 0
            ) {

                console.error(
                    "CodeNest: UPDATE matched 0 rows!"
                );


                setStatus(
                    "Nothing was updated"
                );


                alert(
                    "No database row was updated."
                );


                return;

            }


            editor =
                dataToSave;


            setStatus(
                "Saved ✓"
            );


            setTimeout(
                () => {

                    setStatus(
                        "Ready"
                    );

                },
                2000
            );

        }


        async function checkLogin() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if (error) {

                    console.error(
                        "Session error:",
                        error
                    );

                    return;

                }


                if (
                    data &&
                    data.session
                ) {

                    document.getElementById(
                        "login-screen"
                    ).style.display =
                        "none";


                    await loadEditor();

                }

            } catch (error) {

                console.error(
                    "Check login error:",
                    error
                );

            }

        }


        async function login() {

            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            const errorEl =
                document.getElementById(
                    "login-error"
                );


            errorEl.textContent =
                "";


            if (
                !email ||
                !password
            ) {

                errorEl.textContent =
                    "Email and password are required.";

                return;

            }


            try {

                const result =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email,

                            password

                        });


                if (
                    result.error
                ) {

                    errorEl.textContent =
                        result.error.message;

                    return;

                }


                document.getElementById(
                    "login-screen"
                ).style.display =
                    "none";


                await loadEditor();


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                errorEl.textContent =
                    error.message ||
                    "Login failed.";

            }

        }


        deleteButton.addEventListener(
            "click",
            function () {

                if (
                    !selectedElement ||
                    !selectedData
                )
                    return;


                saveHistory();


                const isCustom =
                    selectedElement.hasAttribute(
                        "data-codenest-custom"
                    );


                if (isCustom) {

                    const id =
                        selectedElement.dataset.codenestId;


                    editor.customElements =
                        editor.customElements.filter(
                            item =>
                                item.id !== id
                        );

                } else {

                    const id =
                        selectedElement.dataset.codenestId;


                    delete editor.elements[id];

                }


                selectedElement.remove();


                selectedElement =
                    null;


                selectedData =
                    null;


                overlay.style.display =
                    "none";


                inspector.style.display =
                    "none";


                setStatus(
                    "Element deleted"
                );

            }
        );


        document.getElementById(
            "login-btn"
        ).addEventListener(
            "click",
            login
        );


        document.getElementById(
            "password"
        ).addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    login();

                }

            }
        );


        document
            .querySelectorAll(".device")
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            setDevice(
                                button.dataset.device
                            );

                        }
                    );

                }
            );


        document.getElementById(
            "save-btn"
        ).addEventListener(
            "click",
            saveEditor
        );


        document.getElementById(
            "undo-btn"
        ).addEventListener(
            "click",
            undo
        );


        document.getElementById(
            "redo-btn"
        ).addEventListener(
            "click",
            redo
        );


        document.getElementById(
            "close-inspector"
        ).addEventListener(
            "click",
            () => {

                selectedElement =
                    null;


                selectedData =
                    null;


                inspector.style.display =
                    "none";


                overlay.style.display =
                    "none";

            }
        );


        [
            "prop-text",
            "prop-link",
            "prop-color",
            "prop-font-size",
            "prop-font-weight",
            "prop-align",
            "prop-width",
            "prop-height",
            "prop-margin",
            "prop-padding",
            "prop-x",
            "prop-y"
        ].forEach(
            id => {

                const element =
                    document.getElementById(id);


                element.addEventListener(
                    "input",
                    event => {
                        propertyChanged(event);
                    }
                );


                element.addEventListener(
                    "change",
                    event => {
                        propertyChanged(event);
                    }
                );

            }
        );


        document.getElementById(
            "prop-color-picker"
        ).addEventListener(
            "input",
            event => {

                const color =
                    normalizeColor(
                        event.target.value
                    );


                document.getElementById(
                    "prop-color"
                ).value =
                    color;


                propertyChanged({
                    target: {
                        id: "prop-color",
                        value: color
                    }
                });

            }
        );


        document.getElementById(
            "reset-position"
        ).addEventListener(
            "click",
            () => {

                if (
                    !selectedData ||
                    !selectedElement
                )
                    return;


                saveHistory();


                const isCustom =
                    selectedElement.hasAttribute(
                        "data-codenest-custom"
                    );


                if (isCustom) {

                    selectedData.x =
                        0;

                    selectedData.y =
                        0;


                    selectedElement.style.left =
                        "0px";


                    selectedElement.style.top =
                        "0px";

                } else {

                    if (
                        !selectedData.positions
                    ) {

                        selectedData.positions = {};

                    }


                    selectedData.positions[
                        currentDevice
                    ] = {

                        x: 0,

                        y: 0

                    };


                    applyElementSettings(
                        selectedElement,
                        selectedData
                    );

                }


                fillInspector();

                updateOverlay();

                setStatus(
                    "Position reset"
                );

            }
        );


        document.getElementById(
            "hide-element"
        ).addEventListener(
            "click",
            () => {

                if (
                    !selectedData ||
                    !selectedElement
                )
                    return;


                saveHistory();


                selectedData.hidden =
                    !selectedData.hidden;


                if (
                    selectedElement.hasAttribute(
                        "data-codenest-custom"
                    )
                ) {

                    if (
                        selectedData.hidden
                    ) {

                        selectedElement.style.display =
                            "none";

                    } else {

                        selectedElement.style.removeProperty(
                            "display"
                        );

                    }

                } else {

                    applyElementSettings(
                        selectedElement,
                        selectedData
                    );

                }


                document.getElementById(
                    "hide-element"
                ).textContent =
                    selectedData.hidden
                        ? "Show element"
                        : "Hide element";


                updateOverlay();


                setStatus(
                    selectedData.hidden
                        ? "Element hidden"
                        : "Element shown"
                );

            }
        );


        document.getElementById(
            "add-btn"
        ).addEventListener(
            "click",
            event => {

                event.stopPropagation();


                addMenu.style.display =
                    addMenu.style.display ===
                        "block"
                        ? "none"
                        : "block";

            }
        );


        document
            .querySelectorAll(".add-item")
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            addingType =
                                button.dataset.add;


                            addMenu.style.display =
                                "none";


                            setStatus(
                                "Click on the page to place it"
                            );

                        }
                    );

                }
            );


        document.getElementById(
            "language-preview"
        ).addEventListener(
            "change",
            event => {

                const doc =
                    frame.contentDocument;


                if (!doc)
                    return;


                const select =
                    doc.querySelector(
                        "#language-select"
                    );


                if (select) {

                    select.value =
                        event.target.value;


                    select.dispatchEvent(
                        new Event(
                            "change",
                            {
                                bubbles: true
                            }
                        )
                    );

                }


                setTimeout(
                    () => {

                        discoverPage();

                        applyEditor();

                        updateOverlay();

                    },
                    300
                );

            }
        );


        frame.addEventListener(
            "load",
            async () => {

                try {

                    await wait(150);


                    frameEventsReady =
                        false;


                    discoverPage();

                    applyEditor();

                    setupFrameEvents();

                    setDevice(
                        currentDevice
                    );


                    setStatus(
                        "Ready"
                    );


                } catch (error) {

                    console.error(
                        "Iframe load error:",
                        error
                    );


                    setStatus(
                        "Editor ready"
                    );

                }

            }
        );


        window.addEventListener(
            "resize",
            () => {

                updateOverlay();

            }
        );


        scrollArea.addEventListener(
            "scroll",
            () => {

                updateOverlay();

            }
        );


        let inspectorDragging =
            false;

        let inspectorOffsetX =
            0;

        let inspectorOffsetY =
            0;


        const inspectorTitle =
            inspector.querySelector(
                ".inspector-title"
            );


        inspectorTitle.style.cursor =
            "move";


        inspectorTitle.addEventListener(
            "mousedown",
            event => {

                inspectorDragging =
                    true;


                const rect =
                    inspector.getBoundingClientRect();


                inspectorOffsetX =
                    event.clientX -
                    rect.left;


                inspectorOffsetY =
                    event.clientY -
                    rect.top;


                event.preventDefault();

            }
        );


        document.addEventListener(
            "mousemove",
            event => {

                if (
                    !inspectorDragging
                )
                    return;


                inspector.style.left =
                    (
                        event.clientX -
                        inspectorOffsetX
                    ) + "px";


                inspector.style.top =
                    (
                        event.clientY -
                        inspectorOffsetY
                    ) + "px";


                inspector.style.right =
                    "auto";

            }
        );


        document.addEventListener(
            "mouseup",
            () => {

                inspectorDragging =
                    false;

            }
        );


        supabaseClient
            .channel(
                "codenest-admin-editor-realtime"
            )
            .on(
                "postgres_changes",
                {
                    event: "UPDATE",
                    schema: "public",
                    table: "site_settings"
                },
                payload => {

                    if (
                        !payload ||
                        !payload.new
                    )
                        return;


                    if (
                        settingsId &&
                        payload.new.id !==
                        settingsId
                    )
                        return;


                    let incoming =
                        payload.new.editor_data;


                    if (
                        typeof incoming ===
                        "string"
                    ) {

                        try {

                            incoming =
                                JSON.parse(
                                    incoming
                                );

                        } catch {

                            return;

                        }

                    }


                    if (
                        !incoming ||
                        typeof incoming !==
                        "object"
                    )
                        return;


                    const oldSelectedId =
                        selectedData?.id ||
                        selectedElement?.dataset?.codenestId ||
                        null;


                    editor =
                        incoming;


                    ensureEditorStructure();


                    applyEditor();


                    if (oldSelectedId) {

                        const custom =
                            editor.customElements.find(
                                item =>
                                    item.id ===
                                    oldSelectedId
                            );


                        if (custom) {

                            selectedElement =
                                frame.contentDocument?.querySelector(
                                    `[data-codenest-custom="true"][data-codenest-id="${cssEscape(oldSelectedId)}"]`
                                ) || null;


                            selectedData =
                                custom;

                        }

                    }


                    if (selectedElement) {

                        fillInspector();

                    }


                    updateOverlay();


                    setStatus(
                        "Updated from server"
                    );


                    setTimeout(
                        () => {

                            setStatus(
                                "Ready"
                            );

                        },
                        1800
                    );

                }
            )
            .subscribe(
                status => {

                    console.log(
                        "CodeNest Realtime:",
                        status
                    );

                }
            );


        supabaseClient
            .auth
            .onAuthStateChange(
                async (
                    event,
                    session
                ) => {

                    if (
                        session &&
                        (
                            event ===
                            "SIGNED_IN" ||
                            event ===
                            "INITIAL_SESSION"
                        )
                    ) {

                        document.getElementById(
                            "login-screen"
                        ).style.display =
                            "none";

                    }

                }
            );


        checkLogin();

    </script>

</body>
